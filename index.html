<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Vòng Quay - Nhà Thuốc Bảo Ngọc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .wheel-container { position: relative; width: 320px; height: 320px; border-radius: 50%; border: 8px solid #FFD700; }
        .wheel { width: 100%; height: 100%; position: relative; border-radius: 50%; transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1); }
        .segment { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: 0 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 15px; }
        .segment-label { transform: rotate(18deg); font-size: 9px; font-weight: 700; color: white; text-align: center; max-width: 60px; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #ef4444; z-index: 30; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body class="bg-slate-100">

    <div id="app" class="container mx-auto p-4 max-w-5xl">
        <div id="app-loader" class="text-center py-20">Đang tải dữ liệu...</div>

        <div id="app-content" class="hidden">
            <!-- Giao diện chính -->
            <div id="registration-view" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-lg">
                <h2 class="text-2xl font-bold text-center mb-6">Đăng Ký Quay Số</h2>
                <form id="register-form" class="space-y-4">
                    <input type="text" id="user-name" placeholder="Họ tên" class="w-full p-4 border rounded-xl" required>
                    <input type="tel" id="user-phone" placeholder="Số điện thoại" class="w-full p-4 border rounded-xl" required>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl">BẮT ĐẦU</button>
                </form>
            </div>

            <div id="wheel-view" class="hidden flex flex-col items-center">
                <div class="relative mb-10">
                    <div class="pointer"></div>
                    <div class="wheel-container"><div id="wheel-element" class="wheel"></div></div>
                </div>
                <button id="spin-button" class="bg-red-600 text-white px-12 py-4 rounded-full font-bold text-xl shadow-lg">QUAY!</button>
                <p class="mt-4 font-bold">Lượt: <span id="turns-display">0</span></p>
            </div>

            <!-- NÚT XEM DANH SÁCH (Dành cho chủ shop) -->
            <div class="mt-20 border-t pt-10 text-center">
                <button onclick="toggleAdmin()" class="text-slate-400 text-xs underline">Quản trị viên (Xem danh sách trúng thưởng)</button>
            </div>

            <!-- BẢNG DANH SÁCH KHÁCH HÀNG -->
            <div id="admin-panel" class="hidden mt-10 bg-white p-6 rounded-2xl shadow-xl overflow-x-auto">
                <h3 class="text-xl font-bold mb-4 text-blue-800">Danh Sách Khách Hàng & Quà Tặng</h3>
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-100">
                            <th class="p-3">Họ Tên</th>
                            <th class="p-3">Số Điện Thoại</th>
                            <th class="p-3">Quà Trúng</th>
                            <th class="p-3">Thời gian</th>
                        </tr>
                    </thead>
                    <tbody id="customer-list">
                        <!-- Dữ liệu sẽ đổ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Popup kết quả -->
        <div id="result-modal" class="modal-backdrop hidden">
            <div class="bg-white p-10 rounded-3xl text-center max-w-sm w-full mx-4">
                <h2 class="text-2xl font-bold mb-4">KẾT QUẢ</h2>
                <div id="modal-prize-text" class="text-xl font-bold text-red-600 mb-6 py-4 bg-red-50 rounded-xl"></div>
                <button id="close-modal" class="w-full bg-slate-900 text-white py-3 rounded-xl">ĐÓNG</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwuifQ6wA3OAfnIjebObv0Nmw9LsDs2-g",
            authDomain: "vong-quay-may-man-5eceb.firebaseapp.com",
            projectId: "vong-quay-may-man-5eceb",
            storageBucket: "vong-quay-may-man-5eceb.firebasestorage.app",
            messagingSenderId: "950395409406",
            appId: "1:950395409406:web:d25b05fc1ea13d64f126af"
        };

        const APP_ID = 'baongoc-lucky-2026-v4'; // Đổi ID này để reset data mới hoàn toàn
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUser = null;
        let prizes = [];

        const PRIZE_DATA = [
            { id: 'p1', name: '10.000đ', quantity: 83, weight: 45, color: '#3b82f6' },
            { id: 'p2', name: '20.000đ', quantity: 79, weight: 45, color: '#8b5cf6' },
            { id: 'p3', name: '50.000đ', quantity: 94, weight: 10, color: '#f43f5e' },
            { id: 'p4', name: '100.000đ', quantity: 92, weight: 10, color: '#1e293b' },
            { id: 'p5', name: 'Khẩu trang KF94', quantity: 99, weight: 250, color: '#10b981' },
            { id: 'p6', name: 'Kẹo ngậm Star', quantity: 99, weight: 250, color: '#f59e0b' },
            { id: 'p7', name: 'May mắn lần sau', quantity: 99, weight: 390, color: '#94a3b8' }
        ];

        async function init() {
            // Khởi tạo kho quà
            const invRef = doc(db, `artifacts/${APP_ID}/data`, 'inventory');
            const snap = await getDoc(invRef);
            if (!snap.exists()) {
                const initial = {}; PRIZE_DATA.forEach(p => initial[p.id] = p);
                await setDoc(invRef, { all: initial });
            }

            // Lắng nghe thay đổi kho quà & danh sách khách hàng
            onSnapshot(invRef, (d) => {
                if (d.exists()) {
                    prizes = Object.values(d.data().all).sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
                    renderWheel();
                }
            });

            // Lấy danh sách khách hàng cho Admin
            const userCol = collection(db, `artifacts/${APP_ID}/users`);
            const q = query(userCol, orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const listHtml = snapshot.docs.map(doc => {
                    const u = doc.data();
                    return `<tr class="border-b">
                        <td class="p-3 font-bold">${u.name}</td>
                        <td class="p-3">${u.phone}</td>
                        <td class="p-3 text-red-600">${u.prize || 'Chưa quay'}</td>
                        <td class="p-3 text-gray-400 text-[10px]">${u.timestamp ? new Date(u.timestamp).toLocaleString() : ''}</td>
                    </tr>`;
                }).join('');
                document.getElementById('customer-list').innerHTML = listHtml;
            });

            document.getElementById('app-loader').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
        }

        function renderWheel() {
            const wheel = document.getElementById('wheel-element');
            wheel.innerHTML = '';
            const angle = 360 / prizes.length;
            prizes.forEach((p, i) => {
                const seg = document.createElement('div');
                seg.className = 'segment';
                seg.style.transform = `rotate(${angle * i}deg)`;
                seg.style.backgroundColor = p.color;
                seg.style.clipPath = `polygon(0 0, 100% 0, 100% 40%, 0 100%)`;
                seg.innerHTML = `<div class="segment-label">${p.name}</div>`;
                wheel.appendChild(seg);
            });
        }

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            const userRef = doc(db, `artifacts/${APP_ID}/users`, phone);
            const snap = await getDoc(userRef);
            
            if (snap.exists()) {
                currentUser = snap.data();
            } else {
                currentUser = { name, phone, turns: 1, prize: "", timestamp: Date.now() };
                await setDoc(userRef, currentUser);
            }
            document.getElementById('registration-view').classList.add('hidden');
            document.getElementById('wheel-view').classList.remove('hidden');
            document.getElementById('turns-display').textContent = currentUser.turns;
        };

        document.getElementById('spin-button').onclick = async () => {
            if (currentUser.turns <= 0) return;
            document.getElementById('spin-button').disabled = true;

            const winner = await runTransaction(db, async (tx) => {
                const invRef = doc(db, `artifacts/${APP_ID}/data`, 'inventory');
                const d = await tx.get(invRef);
                const all = d.data().all;
                const pool = Object.values(all).filter(p => p.quantity > 0);
                const totalW = pool.reduce((s, p) => s + p.weight, 0);
                let r = Math.random() * totalW;
                let sel = pool[0];
                for (const p of pool) { if (r < p.weight) { sel = p; break; } r -= p.weight; }
                if (sel.id !== 'p7') { all[sel.id].quantity--; tx.update(invRef, { all }); }
                return sel;
            });

            const idx = prizes.findIndex(p => p.id === winner.id);
            const deg = 360 * 10 + (360 - (idx * (360/prizes.length))) - (180/prizes.length);
            document.getElementById('wheel-element').style.transform = `rotate(${deg}deg)`;

            setTimeout(async () => {
                currentUser.turns = 0;
                currentUser.prize = winner.name;
                await setDoc(doc(db, `artifacts/${APP_ID}/users`, currentUser.phone), currentUser, { merge: true });
                document.getElementById('modal-prize-text').textContent = winner.name;
                document.getElementById('result-modal').classList.remove('hidden');
                document.getElementById('turns-display').textContent = 0;
            }, 5500);
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('result-modal').classList.add('hidden');
        
        window.toggleAdmin = () => {
            const pass = prompt("Nhập mật mã quản trị:");
            if (pass === "baongoc2026") { // Mật khẩu là baongoc2026
                document.getElementById('admin-panel').classList.toggle('hidden');
            } else {
                alert("Sai mật mã!");
            }
        };

        init();
    </script>
</body>
</html>
