<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Thuốc Bảo Ngọc - Vòng Quay May Mắn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .wheel-container { position: relative; width: 320px; height: 320px; border-radius: 50%; border: 8px solid #FFD700; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .wheel { width: 100%; height: 100%; position: relative; border-radius: 50%; transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1); overflow: hidden; }
        .segment { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: 0 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 20px; }
        .segment-label { transform: rotate(18deg); font-size: 10px; font-weight: 700; color: white; text-align: center; max-width: 65px; line-height: 1.2; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #ef4444; z-index: 30; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app" class="container mx-auto p-4 max-w-4xl min-h-screen flex flex-col">
        <!-- Header -->
        <div class="text-center py-8">
            <h1 class="text-2xl font-black text-blue-900 uppercase">Nhà Thuốc Bảo Ngọc</h1>
            <p class="text-red-500 font-bold text-sm tracking-widest">QUAY LÀ TRÚNG - VUI CÙNG SỨC KHỎE</p>
        </div>

        <div id="app-loader" class="text-center py-20 text-slate-400">Đang khởi tạo hệ thống quà tặng...</div>

        <div id="app-content" class="hidden flex-grow">
            <!-- Đăng ký khách hàng -->
            <div id="registration-view" class="max-w-md mx-auto bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
                <h2 class="text-xl font-bold text-center mb-6">Thông tin khách hàng</h2>
                <form id="register-form" class="space-y-4">
                    <input type="text" id="user-name" placeholder="Họ và tên của bạn" class="w-full px-5 py-4 bg-slate-50 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <input type="tel" id="user-phone" placeholder="Số điện thoại nhận quà" class="w-full px-5 py-4 bg-slate-50 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <button type="submit" class="w-full bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-800 transition-all active:scale-95">XÁC NHẬN LƯỢT QUAY</button>
                </form>
            </div>

            <!-- Vòng quay chính -->
            <div id="wheel-view" class="hidden flex flex-col items-center">
                <div class="relative mb-12 animate-in zoom-in duration-500">
                    <div class="pointer"></div>
                    <div class="wheel-container">
                        <div id="wheel-element" class="wheel"></div>
                    </div>
                </div>
                
                <div class="w-full max-w-sm space-y-4">
                    <button id="spin-button" class="w-full bg-red-600 text-white font-black py-5 rounded-2xl text-2xl shadow-xl hover:bg-red-700 active:scale-95 disabled:bg-slate-300">QUAY NGAY</button>
                    <div class="bg-white p-4 rounded-2xl border text-center font-bold text-blue-900">
                        Bạn còn: <span id="turns-display" class="text-2xl text-red-600">0</span> lượt quay
                    </div>
                </div>
            </div>

            <!-- BẢNG QUẢN TRỊ (CHỈ CHỦ NHÀ THUỐC) -->
            <div id="admin-panel" class="hidden mt-12 bg-white p-6 rounded-3xl shadow-2xl border-2 border-blue-100 overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-black text-blue-800 uppercase">Danh sách trúng thưởng</h3>
                    <button onclick="location.reload()" class="text-xs bg-slate-100 px-3 py-1 rounded-lg">Làm mới</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="border-b-2 border-slate-100 text-slate-400 uppercase text-[10px] tracking-widest">
                                <th class="pb-3 px-2">Khách hàng</th>
                                <th class="pb-3 px-2">Số điện thoại</th>
                                <th class="pb-3 px-2">Quà trúng</th>
                                <th class="pb-3 px-2 text-right">Thời gian</th>
                            </tr>
                        </thead>
                        <tbody id="customer-list" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Nút Admin ẩn danh -->
        <div class="mt-auto py-10 text-center">
            <button onclick="checkAdmin()" class="text-slate-300 text-[10px] hover:text-blue-400 transition-colors">Dành cho Quản trị viên</button>
        </div>

        <!-- Popup Kết quả -->
        <div id="result-modal" class="modal-backdrop hidden">
            <div class="bg-white p-10 rounded-[3rem] text-center max-w-sm w-full mx-4 shadow-2xl">
                <div class="text-5xl mb-4">🎁</div>
                <h2 class="text-2xl font-black mb-2">CHÚC MỪNG!</h2>
                <p class="text-slate-500 mb-6">Bạn đã may mắn nhận được:</p>
                <div id="modal-prize-text" class="text-xl font-black text-red-600 mb-8 p-6 bg-red-50 rounded-3xl border-2 border-red-100"></div>
                <button id="close-modal" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl">XÁC NHẬN</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwuifQ6wA3OAfnIjebObv0Nmw9LsDs2-g",
            authDomain: "vong-quay-may-man-5eceb.firebaseapp.com",
            projectId: "vong-quay-may-man-5eceb",
            storageBucket: "vong-quay-may-man-5eceb.firebasestorage.app",
            messagingSenderId: "950395409406",
            appId: "1:950395409406:web:d25b05fc1ea13d64f126af"
        };

        const APP_ID = 'baongoc-lucky-2026-v86868';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUser = null;
        let prizes = [];

        async function init() {
            const invRef = doc(db, `artifacts/${APP_ID}/data`, 'inventory');
            const snap = await getDoc(invRef);
            if (!snap.exists()) {
                const initial = {
                    p1: { id: 'p1', name: '10.000đ', quantity: 80, weight: 40, color: '#3b82f6' },
                    p2: { id: 'p2', name: '20.000đ', quantity: 50, weight: 30, color: '#8b5cf6' },
                    p3: { id: 'p3', name: '50.000đ', quantity: 20, weight: 10, color: '#f43f5e' },
                    p4: { id: 'p4', name: 'KF94 BBT', quantity: 100, weight: 200, color: '#10b981' },
                    p5: { id: 'p5', name: 'Kẹo Star', quantity: 100, weight: 200, color: '#f59e0b' },
                    p6: { id: 'p6', name: 'Lần sau nhé', quantity: 999, weight: 520, color: '#94a3b8' }
                };
                await setDoc(invRef, { all: initial });
            }

            onSnapshot(invRef, (d) => {
                if (d.exists()) {
                    prizes = Object.values(d.data().all).sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric:true}));
                    renderWheel();
                }
            });

            const userCol = collection(db, `artifacts/${APP_ID}/users`);
            const q = query(userCol, orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const listHtml = snapshot.docs.map(doc => {
                    const u = doc.data();
                    return `<tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-3 px-2 font-bold">${u.name}</td>
                        <td class="py-3 px-2 font-mono">${u.phone}</td>
                        <td class="py-3 px-2 text-red-600 font-bold">${u.prize || '--'}</td>
                        <td class="py-3 px-2 text-right text-[10px] text-slate-400">${u.timestamp ? new Date(u.timestamp).toLocaleTimeString() : ''}</td>
                    </tr>`;
                }).join('');
                document.getElementById('customer-list').innerHTML = listHtml;
            });

            document.getElementById('app-loader').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
        }

        function renderWheel() {
            const wheel = document.getElementById('wheel-element');
            wheel.innerHTML = '';
            const angle = 360 / prizes.length;
            prizes.forEach((p, i) => {
                const seg = document.createElement('div');
                seg.className = 'segment';
                seg.style.transform = `rotate(${angle * i}deg)`;
                seg.style.backgroundColor = p.color;
                seg.style.clipPath = `polygon(0 0, 100% 0, 100% 60%, 0 100%)`;
                seg.innerHTML = `<div class="segment-label">${p.name}</div>`;
                wheel.appendChild(seg);
            });
        }

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;
            const userRef = doc(db, `artifacts/${APP_ID}/users`, phone);
            const snap = await getDoc(userRef);
            
            if (snap.exists()) {
                currentUser = snap.data();
            } else {
                currentUser = { name, phone, turns: 1, prize: "", timestamp: Date.now() };
                await setDoc(userRef, currentUser);
            }
            document.getElementById('registration-view').classList.add('hidden');
            document.getElementById('wheel-view').classList.remove('hidden');
            document.getElementById('turns-display').textContent = currentUser.turns;
        };

        document.getElementById('spin-button').onclick = async () => {
            if (currentUser.turns <= 0) {
                alert("Bạn đã hết lượt quay!");
                return;
            }
            document.getElementById('spin-button').disabled = true;

            const winner = await runTransaction(db, async (tx) => {
                const invRef = doc(db, `artifacts/${APP_ID}/data`, 'inventory');
                const d = await tx.get(invRef);
                const all = d.data().all;
                const pool = Object.values(all).filter(p => p.quantity > 0);
                const totalW = pool.reduce((s, p) => s + p.weight, 0);
                let r = Math.random() * totalW;
                let sel = pool[0];
                for (const p of pool) { if (r < p.weight) { sel = p; break; } r -= p.weight; }
                if (sel.id !== 'p6') { all[sel.id].quantity--; tx.update(invRef, { all }); }
                return sel;
            });

            const idx = prizes.findIndex(p => p.id === winner.id);
            const deg = 360 * 8 + (360 - (idx * (360/prizes.length))) - (180/prizes.length);
            document.getElementById('wheel-element').style.transform = `rotate(${deg}deg)`;

            setTimeout(async () => {
                currentUser.turns = 0;
                currentUser.prize = winner.name;
                await setDoc(doc(db, `artifacts/${APP_ID}/users`, currentUser.phone), currentUser, { merge: true });
                document.getElementById('modal-prize-text').textContent = winner.name;
                document.getElementById('result-modal').classList.remove('hidden');
                document.getElementById('turns-display').textContent = 0;
            }, 5500);
        };

        document.getElementById('close-modal').onclick = () => document.getElementById('result-modal').classList.add('hidden');
        
        window.checkAdmin = () => {
            const pass = prompt("Nhập mật mã quản trị:");
            if (pass === "86868") {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
                alert("Đã mở bảng danh sách phía dưới!");
            } else {
                alert("Mật mã không đúng!");
            }
        };

        init();
    </script>
</body>
</html>
